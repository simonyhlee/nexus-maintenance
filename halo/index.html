<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALO — maintenance complete</title>
<style>
  :root {
    --ground:#f4efe2; --card:#fffdf8; --navy:#243547; --deep:#07162a;
    --amber:#f0b429; --amber-hover:#d4950a; --amber-active:#c07800;
    --amber-text:#a86e00; --line:rgba(148,132,100,.22); --muted:#948464;
    --font:'Inter','Noto Sans TC',system-ui,'PingFang TC','Microsoft JhengHei',sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--ground); color:var(--navy); font-family:var(--font);
         line-height:1.75; padding:2rem 1.25rem; }
  main { max-width:34rem; width:100%; background:var(--card); border:1px solid var(--line);
         border-radius:14px; padding:2.6rem 2.4rem; text-align:center; }
  .mark { display:inline-flex; flex-direction:column; align-items:center; margin-bottom:1.2rem; }
  .mark svg { display:block; }
  .mark .label { font-weight:600; letter-spacing:.18em; font-size:.95rem; color:var(--navy);
                 margin-top:.55rem; }
  h1 { font-size:1.2rem; font-weight:600; margin:.2rem 0 1rem; }
  h1 .zh-title { display:block; margin-bottom:.15rem; }
  h1 .en-title { display:block; font-size:.98rem; color:var(--muted); font-weight:500; }
  .zh { font-size:1rem; margin:.4rem 0 1.1rem; }
  .en { font-size:.92rem; color:var(--muted); margin:.3rem 0; }
  .btn-return { display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--amber); color:#1a1d24; border:none; border-radius:999px;
    padding:.85rem 2.6rem; cursor:pointer; font-family:var(--font); margin-top:1.3rem;
    box-shadow:0 2px 12px rgba(240,180,41,.35); }
  .btn-return:hover { background:var(--amber-hover); }
  .btn-return:active { background:var(--amber-active); }
  .btn-return .verb { font-size:.8rem; font-weight:400; opacity:.8; letter-spacing:.04em; }
  .btn-return .dest { font-size:1.3rem; font-weight:600; letter-spacing:.03em; }
  .note { font-size:.8rem; color:var(--muted); margin-top:1.3rem; }
  .note p { margin:.2rem 0; }
</style>
</head>
<body>
<main>
  <div class="mark" role="img" aria-label="HALO">
    <div id="orb-torus-mount" style="width:110px;height:110px;position:relative;display:inline-block;flex-shrink:0;"></div>
    <div class="label">HALO</div>
  </div>

  <h1><span class="zh-title">伺服器維護已完成</span><span class="en-title">Server maintenance is now complete.</span></h1>

  <p class="zh">感謝您耐心等候。您現在可以返回，繼續您的對話。</p>
  <p class="en">Thank you for your patience. You can now return to your sessions.</p>

  <button class="btn-return" type="button" onclick="window.location.href='https://halonexus.co'">
    <span class="verb">返回 / Back to</span>
    <span class="dest">HALO</span>
  </button>

  <div class="note">
    <p>如未能立即載入，請重新整理一次。</p>
    <p>If it does not load right away, please refresh once.</p>
  </div>
</main>
<script><script>
(function () {
  // verbatim port of NxHaloOrb.svelte (the orb logomark #82) — aurora core,
  // resting state, size 140. One wave generator draws the whole mark.
  var HARMONICS = [{k:3,a:0.030,v:0.62},{k:5,a:0.020,v:-0.44},{k:8,a:0.013,v:0.31}];
  var AURA_R = 36, EMIT_PERIOD = 4.2;
  var LAYERS = [
    {base:7,amp:0.42,sw:1.5,o:0.6,speed:1.0,delay:0},
    {base:11,amp:0.35,sw:1.35,o:0.46,speed:0.9,delay:0.7},
    {base:15,amp:0.27,sw:1.2,o:0.33,speed:1.05,delay:1.4},
    {base:18.5,amp:0.19,sw:1.1,o:0.22,speed:0.88,delay:2.1},
    {base:21.8,amp:0.13,sw:1.0,o:0.15,speed:0.96,delay:2.8}
  ];
  var SPECTRUM = {white:'#ffffff', blue:'#7fa9de', pink:'#e898bf', green:'#82c5a0'};
  var AMBER = '#f0b429', AMBER_HOT = '#f8dd8f', INK = 'rgba(36,53,71,0.12)';
  var NS = 'http://www.w3.org/2000/svg';
  var clock = 0, lastTs = null;
  var layerPhases = LAYERS.map(function(_, i){ return [0, 2.1, 4.2].map(function(h){ return h + i * 1.7; }); });
  var emitT = [0.15, 0.65], iriRot = [0, 72, 144, 216, 288];

  function wavePathFor(phs, radius, ampScale) {
    var SAMPLES = 120, pts = [];
    for (var s = 0; s <= SAMPLES; s++) {
      var th = (s / SAMPLES) * Math.PI * 2, r = radius;
      for (var h = 0; h < HARMONICS.length; h++) {
        r += radius * HARMONICS[h].a * ampScale * Math.sin(HARMONICS[h].k * th + phs[h]);
      }
      pts.push((50 + r * Math.cos(th)).toFixed(2) + ',' + (50 - r * Math.sin(th)).toFixed(2));
    }
    return 'M' + pts.join('L') + 'Z';
  }
  function layerPath(i, pulsePhase) {
    var L = LAYERS[i];
    var pulse = 1 + 0.07 * Math.sin(clock * 1.4 * L.speed - L.delay + pulsePhase);
    var drift = 0.15 * Math.sin(clock * 5.5 + i * 1.1);
    return wavePathFor(layerPhases[i], L.base * pulse + drift + L.amp * 4, L.amp);
  }

  var host = document.getElementById('orb-torus-mount');
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('fill', 'none');
  svg.setAttribute('width', '140'); svg.setAttribute('height', '140');
  svg.style.position = 'absolute'; svg.style.inset = '0'; svg.style.overflow = 'visible';
  host.appendChild(svg);
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e); return e;
  }
  var defs = el('defs', {});
  // the bloom — the orb's atmosphere
  var bloom = el('radialGradient', {id:'orb-bloom', cx:'50%', cy:'50%', r:'50%'}, defs);
  el('stop', {offset:'0%','stop-color':AMBER,'stop-opacity':'0.26'}, bloom);
  el('stop', {offset:'42%','stop-color':AMBER,'stop-opacity':'0.11'}, bloom);
  el('stop', {offset:'100%','stop-color':AMBER,'stop-opacity':'0'}, bloom);
  // the pastel heart — white, the light itself
  var heart = el('radialGradient', {id:'orb-heart', cx:'50%', cy:'50%', r:'50%'}, defs);
  el('stop', {offset:'0%','stop-color':SPECTRUM.white,'stop-opacity':'0.62'}, heart);
  el('stop', {offset:'60%','stop-color':SPECTRUM.white,'stop-opacity':'0.14'}, heart);
  el('stop', {offset:'100%','stop-color':SPECTRUM.white,'stop-opacity':'0'}, heart);
  // the four-color sweep, one gradient per ring, slowly revolving
  var iri = [];
  for (var g = 0; g < 5; g++) {
    var lg = el('linearGradient', {id:'orb-iri-'+g, gradientUnits:'userSpaceOnUse', x1:'0', y1:'50', x2:'100', y2:'50'}, defs);
    el('stop', {offset:'0%','stop-color':SPECTRUM.white}, lg);
    el('stop', {offset:'30%','stop-color':SPECTRUM.blue}, lg);
    el('stop', {offset:'52%','stop-color':SPECTRUM.pink}, lg);
    el('stop', {offset:'74%','stop-color':SPECTRUM.green}, lg);
    el('stop', {offset:'100%','stop-color':SPECTRUM.white}, lg);
    iri.push(lg);
  }
  var softer = el('filter', {id:'orb-softer', x:'-60%', y:'-60%', width:'220%', height:'220%'}, defs);
  el('feGaussianBlur', {stdDeviation:'3.6'}, softer);

  el('circle', {cx:50, cy:50, r:49, fill:'url(#orb-bloom)'});
  // the SOLID halo aura — gold in every core (reach stays 'core')
  el('circle', {cx:50, cy:50, r:AURA_R, stroke:AMBER, 'stroke-width':9, fill:'none', opacity:0.2});
  var auraInner = el('circle', {cx:50, cy:50, r:AURA_R, stroke:AMBER, 'stroke-width':5.2, fill:'none', opacity:0.95});
  // the aurora cloud — four pastel masses, blurred, on staggered ebb cycles
  var cloud = el('g', {filter:'url(#orb-softer)'});
  var masses = [
    el('circle', {cx:42, cy:44, r:16, fill:SPECTRUM.blue, opacity:0.5}, cloud),
    el('circle', {cx:58, cy:55, r:15, fill:SPECTRUM.pink, opacity:0.45}, cloud),
    el('circle', {cx:47, cy:58, r:12, fill:SPECTRUM.green, opacity:0.4}, cloud),
    el('circle', {cx:50, cy:49, r:8.5, fill:SPECTRUM.white, opacity:0.6}, cloud)
  ];
  var mCycle = [7.3, 9.1, 11.7, 8.4]; // incommensurate ebb cycles, seconds
  // two faint sweep lines suggest the rings
  var sweep = [];
  [2, 3].forEach(function (li) {
    sweep.push(el('path', {stroke:'url(#orb-iri-'+li+')', 'stroke-width':LAYERS[li].sw,
      opacity:LAYERS[li].o * 0.9 * 1.25, fill:'none'}));
  });
  // the pastel heart
  el('circle', {cx:50, cy:50, r:23, fill:'url(#orb-heart)'});

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var auraGolden = [auraInner];
  function frame(ts) {
    if (lastTs !== null) {
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      clock += dt;
      layerPhases = layerPhases.map(function (ph, i) {
        return ph.map(function (p, h) { return p + [0.62, -0.44, 0.31][h] * LAYERS[i].speed * dt; });
      });
      emitT = emitT.map(function (t) { return (t + dt / EMIT_PERIOD) % 1; });
      iriRot = iriRot.map(function (r, i) { return (r + dt * (5 + i * 1.6)) % 360; });
      sweep.forEach(function (p, i) { p.setAttribute('d', layerPath(i + 2, 0)); });
      auraGolden.forEach(function (c) { /* the golden ring holds steady */ });
    }
    // the aurora ebb: each mass drifts and swells on its own slow cycle
    masses.forEach(function (m, i) {
      var e = 0.5 + 0.5 * Math.sin((ts / 1000) * (Math.PI * 2 / mCycle[i]) + i * 1.3);
      m.setAttribute('opacity', ([0.5, 0.45, 0.4, 0.6][i] * (0.75 + 0.25 * e)).toFixed(3));
      m.setAttribute('transform', 'translate(' + (1.6 * Math.sin(ts / 1000 * (Math.PI * 2 / mCycle[i]) + i)).toFixed(2) + ',' + (1.4 * Math.cos(ts / 1000 * (Math.PI * 2 / mCycle[i]) + i * 1.1)).toFixed(2) + ')');
    });
    lastTs = ts;
    if (!reduced) requestAnimationFrame(frame);
  }
  // the mark is complete without rAF — draw the finished form first
  sweep.forEach(function (p, i) { p.setAttribute('d', layerPath(i + 2, 0)); });
  frame(0);
  if (!reduced) requestAnimationFrame(frame);
})();
</script></script>
</body>
</html>
