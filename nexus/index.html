<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS — maintenance complete</title>
<style>
  :root {
    --ground:#f4efe2; --card:#fffdf8; --navy:#243547; --deep:#07162a;
    --amber:#f0b429; --amber-hover:#d4950a; --amber-active:#c07800;
    --amber-text:#a86e00; --line:rgba(148,132,100,.22); --muted:#948464;
    --font:'Inter','Noto Sans TC',system-ui,'PingFang TC','Microsoft JhengHei',sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--ground); color:var(--navy); font-family:var(--font);
         line-height:1.75; padding:2rem 1.25rem; }
  main { max-width:34rem; width:100%; background:var(--card); border:1px solid var(--line);
         border-radius:14px; padding:2.6rem 2.4rem; text-align:center; }
  .mark { display:inline-flex; flex-direction:column; align-items:center; margin-bottom:1.2rem; }
  .mark svg { display:block; }
  .mark .label { font-weight:600; letter-spacing:.18em; font-size:.95rem; color:var(--navy);
                 margin-top:.55rem; }
  h1 { font-size:1.2rem; font-weight:600; margin:.2rem 0 1rem; }
  h1 .zh-title { display:block; margin-bottom:.15rem; }
  h1 .en-title { display:block; font-size:.98rem; color:var(--muted); font-weight:500; }
  .zh { font-size:1rem; margin:.4rem 0 1.1rem; }
  .en { font-size:.92rem; color:var(--muted); margin:.3rem 0; }
  .btn-return { display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--amber); color:#1a1d24; border:none; border-radius:999px;
    padding:.85rem 2.6rem; cursor:pointer; font-family:var(--font); margin-top:1.3rem;
    box-shadow:0 2px 12px rgba(240,180,41,.35); }
  .btn-return:hover { background:var(--amber-hover); }
  .btn-return:active { background:var(--amber-active); }
  .btn-return .verb { font-size:.8rem; font-weight:400; opacity:.8; letter-spacing:.04em; }
  .btn-return .dest { font-size:1.3rem; font-weight:600; letter-spacing:.03em; }
  .note { font-size:.8rem; color:var(--muted); margin-top:1.3rem; }
  .note p { margin:.2rem 0; }
</style>
</head>
<body>
<main>
  <div class="mark" role="img" aria-label="NEXUS">
    <div id="orb-torus-mount" style="width:110px;height:110px;position:relative;display:inline-block;flex-shrink:0;"></div>
    <div class="label">NEXUS</div>
  </div>

  <h1><span class="zh-title">伺服器維護已完成</span><span class="en-title">Server maintenance is now complete.</span></h1>

  <p class="zh">感謝您耐心等候。您現在可以返回，繼續您的對話。</p>
  <p class="en">Thank you for your patience. You can now return to your sessions.</p>

  <button class="btn-return" type="button" onclick="window.location.href='https://nexus.cqlabs.co'">
    <span class="verb">返回 / Back to</span>
    <span class="dest">NEXUS</span>
  </button>

  <div class="note">
    <p>如未能立即載入，請重新整理一次。</p>
    <p>If it does not load right away, please refresh once.</p>
  </div>
</main>
<script>
(function () {
  // verbatim port of NxTorusLogo.svelte — the animated horn-torus logomark
  var size = 160, R = size * 0.290, scale = (size * 0.425) / R;
  var TILT = 15 * Math.PI / 180, sinT = Math.sin(TILT), cosT = Math.cos(TILT);
  var cx = size / 2, cy = size / 2;
  var nLat = 12, nMer = 24, nSteps = 72, AMBER = '#d58200', AMBER2 = '#f0a020';
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
  svg.setAttribute('width', '110'); svg.setAttribute('height', '110');
  svg.setAttribute('fill', 'none');
  svg.style.position = 'absolute'; svg.style.inset = '0'; svg.style.overflow = 'visible';
  document.getElementById('orb-torus-mount').appendChild(svg);
  var NS = 'http://www.w3.org/2000/svg';
  function pt(u, v, uOff) {
    var px = cx + scale * R * (1 + Math.cos(v)) * Math.cos(u + uOff);
    var py = cy - scale * (R * (1 + Math.cos(v)) * Math.sin(u + uOff) * sinT + R * Math.sin(v) * cosT);
    return px.toFixed(2) + ',' + py.toFixed(2);
  }
  var mer = [], lat = [], i, j, d, u, v;
  for (i = 0; i < nMer; i++) { mer.push(document.createElementNS(NS, 'path')); }
  for (i = 0; i < nLat; i++) { lat.push(document.createElementNS(NS, 'path')); }
  mer.concat(lat).forEach(function (p) {
    p.setAttribute('stroke', AMBER); p.setAttribute('stroke-width', '0.75');
    p.setAttribute('stroke-linecap', 'round'); p.setAttribute('opacity', '0.85');
    svg.appendChild(p);
  });
  var glow = document.createElementNS(NS, 'circle');
  glow.setAttribute('cx', cx); glow.setAttribute('cy', cy); glow.setAttribute('r', R * 1.9);
  glow.setAttribute('fill', AMBER2); glow.setAttribute('opacity', '0.05');
  svg.insertBefore(glow, svg.firstChild);
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var uOff = 0, last = 0;
  function draw() {
    var du = uOff;
    for (i = 0; i < nMer; i++) {
      u = (i / nMer) * Math.PI * 2; d = '';
      for (j = 0; j <= nSteps; j++) { v = (j / nSteps) * Math.PI * 2; d += (j ? 'L' : 'M') + pt(u, v, du); }
      mer[i].setAttribute('d', d);
    }
    for (i = 0; i < nLat; i++) {
      v = (i / nLat) * Math.PI * 2; d = '';
      for (j = 0; j <= nSteps; j++) { u = (j / nSteps) * Math.PI * 2; d += (j ? 'L' : 'M') + pt(u, v, du); }
      lat[i].setAttribute('d', d);
    }
  }
  draw();
  if (!reduced) {
    function tick(t) {
      if (!last) last = t;
      uOff += (t - last) * 0.001 * (0.4 * Math.PI * 2 / 60); // 0.4 rpm
      last = t; draw(); requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
